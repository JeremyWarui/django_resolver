# pytest.ini
[pytest]
# 1. Tells pytest which Django settings file to use
DJANGO_SETTINGS_MODULE = resolver.test_settings

# 2. Defines file patterns for test discovery (optional but recommended)
python_files = test_*.py

# 3. Test paths
testpaths = tests

# 4. Recommended options for better output and performance
addopts =
    -rsx
    --strict-markers
    --cov=apps
    --cov-report=term-missing
