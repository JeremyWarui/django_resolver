# pytest.ini
[pytest]
# 1. Tells pytest which Django settings file to use
DJANGO_SETTINGS_MODULE = resolver.settings

# 2. Defines file patterns for test discovery (optional but recommended)
python_files = tests.py test_*.py *_tests.py

# 3. Recommended options for better output and performance
addopts =
    -rsx # Show summary of skipped and xfailed tests
    --strict-markers # Enforce marker usage
    --reuse-db # Speeds up testing by reusing the test database